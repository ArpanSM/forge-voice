[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-voice"
version = "0.1.0"
description = "Local-first voice booking agent delivery kit for two synthetic home-services tenants"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "livekit-api>=1.0,<2",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]
demo = [
  "livekit-agents>=1.8,<2",
  "livekit-plugins-openai>=1.8,<2",
  "livekit-plugins-silero>=1.8,<2",
]

[project.scripts]
forge-voice-audio = "forge_voice.audio.fixtures:main"
forge-voice-web = "forge_voice.web.app:main"
forge-voice-agent = "forge_voice.runtime.livekit_agent:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forge_voice = ["web/static/*.js", "web/static/*.md"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
