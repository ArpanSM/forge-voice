<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge Voice — the proof number</title>
<style>
  @font-face { font-family: "Noto Sans"; src: url("fonts/NotoSans-Regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "Noto Sans"; src: url("fonts/NotoSans-Bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "Noto Sans Mono"; src: url("fonts/NotoSansMono-Regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "Noto Serif"; src: url("fonts/NotoSerif-Regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "Noto Serif"; src: url("fonts/NotoSerif-Italic.ttf") format("truetype"); font-weight: 400; font-style: italic; }
  :root {
    --ink: #0a1120; --surface: #101a2e; --line: #1e2c46;
    --text: #e8eef7; --muted: #8fa0b8; --accent: #3d8bff;
    --amber: #f0a83c; --green: #34c98e; --red: #e05a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: var(--ink); }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--text);
    font-family: "Noto Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(circle at 50% 42%, rgba(61,139,255,0.16), transparent 30rem),
      radial-gradient(circle at 4% 96%, rgba(61,139,255,0.06), transparent 26rem),
      var(--ink);
  }
  #stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(143,160,184,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(143,160,184,0.05) 1px, transparent 1px);
    background-size: 96px 96px;
    mask-image: radial-gradient(circle at 50% 45%, #000 25%, transparent 80%);
  }
  .frame { position: absolute; inset: 0; padding: 96px 112px 76px; display: flex; flex-direction: column; align-items: flex-start; }
  .kicker {
    font-family: "Noto Sans Mono", monospace; font-size: 15px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--accent);
  }
  .metric { margin-top: 40px; display: flex; align-items: center; gap: 56px; }
  .zero-wrap { position: relative; width: 460px; height: 460px; display: flex; align-items: center; justify-content: center; }
  .zero-ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(61,139,255,0.35);
    box-shadow: 0 0 90px rgba(61,139,255,0.18) inset, 0 0 60px rgba(61,139,255,0.10);
  }
  .zero-ring.two { inset: 26px; border-color: rgba(143,160,184,0.18); box-shadow: none; }
  .zero {
    font-family: "Noto Serif", Georgia, serif; font-weight: 400;
    font-size: 380px; line-height: 1; letter-spacing: -0.05em; color: var(--text);
    transform: translateY(18px);
  }
  .unit { max-width: 520px; }
  .unit h1 {
    margin: 0; font-family: "Noto Serif", Georgia, serif; font-weight: 400;
    font-size: 96px; line-height: 1.02; letter-spacing: -0.035em;
  }
  .unit h1 .em { font-style: italic; color: var(--accent); }
  .unit p { margin: 22px 0 0; font-size: 24px; line-height: 1.5; color: var(--muted); }
  .unit p b { color: var(--text); font-weight: 700; }
  .caveat {
    margin-top: 40px; display: inline-flex; align-items: center; gap: 14px;
    border: 1px solid rgba(240,168,60,0.4); border-radius: 999px;
    background: rgba(240,168,60,0.08); padding: 14px 24px;
    font-family: "Noto Sans Mono", monospace; font-size: 16px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--amber);
  }
  .caveat .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 12px rgba(240,168,60,0.7); }
  .foot {
    margin-top: auto; width: 100%; display: flex; justify-content: space-between;
    border-top: 1px solid var(--line); padding-top: 24px;
    font-family: "Noto Sans Mono", monospace; font-size: 13px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
  }
  .foot .repo { color: var(--text); }
</style>
</head>
<body>
<div id="stage" data-composition-id="metric" data-width="1920" data-height="1080" data-duration="6.5">
  <div class="frame">
    <div class="kicker">The proof number</div>
    <div class="metric">
      <div class="zero-wrap">
        <div class="zero-ring" id="ring1"></div>
        <div class="zero-ring two" id="ring2"></div>
        <div class="zero" id="zero">0</div>
      </div>
      <div class="unit">
        <h1>unsafe<br><span class="em">writes.</span></h1>
        <p>Zero double bookings and zero unconfirmed writes across <b>40 text scenarios</b>.</p>
      </div>
    </div>
    <div class="caveat" id="caveat"><span class="dot"></span>live audio 5/6 · all hard gates green</div>
    <div class="foot">
      <span class="repo">Forge Voice · proof of concept</span>
      <span>local-only · synthetic · no production SLA</span>
    </div>
  </div>
</div>
<script src="gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.from('#stage', { opacity: 0, duration: 0.45, ease: 'power2.out' }, 0);
  tl.from('.kicker', { y: 14, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0.12);
  tl.fromTo('#ring1', { scale: 0.82, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.9, ease: 'power3.out' }, 0.25);
  tl.fromTo('#ring2', { scale: 0.86, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.9, ease: 'power3.out' }, 0.4);
  tl.fromTo('#zero', { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.85, ease: 'power3.out' }, 0.45);
  tl.from('.unit h1', { y: 26, opacity: 0, duration: 0.7, ease: 'power3.out' }, 0.6);
  tl.from('.unit p', { y: 18, opacity: 0, duration: 0.6, ease: 'power2.out' }, 0.85);
  tl.from('#caveat', { y: 16, opacity: 0, duration: 0.55, ease: 'power2.out' }, 1.25);
  tl.from('.foot', { opacity: 0, duration: 0.55, ease: 'power2.out' }, 1.5);
  tl.to('#ring1', { boxShadow: '0 0 120px rgba(61,139,255,0.28) inset, 0 0 80px rgba(61,139,255,0.16)', duration: 1.6, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2.2);
  tl.to({}, { duration: 6.5 });
  window.__timelines = window.__timelines || {};
  window.__timelines['metric'] = tl;
  window.__compositionReady = Promise.resolve();
</script>
</body>
</html>
