<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge Voice — next step</title>
<style>
  @font-face { font-family: "Noto Sans"; src: url("fonts/NotoSans-Regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "Noto Sans"; src: url("fonts/NotoSans-Bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "Noto Sans Mono"; src: url("fonts/NotoSansMono-Regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "Noto Serif"; src: url("fonts/NotoSerif-Regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "Noto Serif"; src: url("fonts/NotoSerif-Italic.ttf") format("truetype"); font-weight: 400; font-style: italic; }
  :root {
    --ink: #0a1120; --surface: #101a2e; --line: #1e2c46;
    --text: #e8eef7; --muted: #8fa0b8; --accent: #3d8bff;
    --amber: #f0a83c; --green: #34c98e; --red: #e05a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: var(--ink); }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--text);
    font-family: "Noto Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(circle at 90% 8%, rgba(61,139,255,0.16), transparent 34rem),
      radial-gradient(circle at 2% 98%, rgba(61,139,255,0.07), transparent 26rem),
      var(--ink);
  }
  #stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(143,160,184,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(143,160,184,0.05) 1px, transparent 1px);
    background-size: 96px 96px;
    mask-image: radial-gradient(circle at 50% 40%, #000 25%, transparent 82%);
  }
  .frame { position: absolute; inset: 0; padding: 96px 112px 72px; display: flex; flex-direction: column; }
  .kicker {
    font-family: "Noto Sans Mono", monospace; font-size: 15px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--accent);
  }
  h1 {
    margin: 30px 0 0; max-width: 1400px;
    font-family: "Noto Serif", Georgia, serif; font-weight: 400;
    font-size: 132px; line-height: 1.0; letter-spacing: -0.04em;
  }
  h1 .em { font-style: italic; color: var(--accent); }
  .sub {
    margin: 34px 0 0; max-width: 1080px;
    font-size: 27px; line-height: 1.5; color: var(--muted);
  }
  .sub b { color: var(--text); font-weight: 700; }
  .url {
    margin-top: 44px; display: inline-flex; align-items: center; gap: 16px;
    font-family: "Noto Sans Mono", monospace; font-size: 22px; letter-spacing: 0.04em;
    color: var(--text);
  }
  .url .mark {
    width: 34px; height: 34px; border-radius: 50%; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 30px rgba(61,139,255,0.45);
  }
  .url .mark svg { width: 18px; height: 18px; }
  .foot {
    margin-top: auto; border-top: 1px solid var(--line); padding-top: 24px;
    display: flex; justify-content: space-between; gap: 40px;
    font-family: "Noto Sans Mono", monospace; font-size: 14px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
  }
  .foot .tag { display: inline-flex; align-items: center; gap: 10px; }
  .foot .tag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px rgba(52,201,142,0.6); }
</style>
</head>
<body>
<div id="stage" data-composition-id="endcard" data-width="1920" data-height="1080" data-duration="8">
  <div class="frame">
    <div class="kicker">Next step</div>
    <h1>Send <span class="em">two call flows.</span></h1>
    <p class="sub">And your worst failure. I'll tell you what's <b>model</b>, <b>policy</b>, or <b>integration</b> — and what I'd fix first.</p>
    <div class="url" id="url">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#0a1120" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>
      github.com/ArpanSM/forge-voice
    </div>
    <div class="foot">
      <span class="tag"><span class="dot"></span>Proof of concept · method applies to your call flow</span>
      <span>Local-only · synthetic · no production SLA</span>
    </div>
  </div>
</div>
<script src="gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.from('#stage', { opacity: 0, duration: 0.45, ease: 'power2.out' }, 0);
  tl.from('.kicker', { y: 14, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0.12);
  tl.from('h1', { y: 34, opacity: 0, duration: 0.85, ease: 'power3.out' }, 0.26);
  tl.from('.sub', { y: 22, opacity: 0, duration: 0.7, ease: 'power2.out' }, 0.6);
  tl.from('#url', { y: 18, opacity: 0, duration: 0.6, ease: 'power2.out' }, 0.9);
  tl.from('.foot', { opacity: 0, duration: 0.6, ease: 'power2.out' }, 1.2);
  tl.fromTo('#url .mark', { boxShadow: '0 0 0 rgba(61,139,255,0)' }, { boxShadow: '0 0 44px rgba(61,139,255,0.6)', duration: 1.2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.6);
  tl.to({}, { duration: 8 });
  window.__timelines = window.__timelines || {};
  window.__timelines['endcard'] = tl;
  window.__compositionReady = Promise.resolve();
</script>
</body>
</html>
